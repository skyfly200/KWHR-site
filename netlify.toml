# Netlify build config for the Nuxt static site.
[build]
  command = "npm run generate"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# `nuxt generate` prerenders every crawlable route to static HTML in
# .output/public, which Nuxt also copies to dist/. A 200.html SPA fallback is
# emitted for any client-only route.
[[redirects]]
  from = "/*"
  to = "/200.html"
  status = 200
