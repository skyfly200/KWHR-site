# Netlify build config for the Nuxt static site.
[build]
  command = "npm run generate"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "20"
  # Force Nuxt/Nitro to emit a plain static site (to .output/public, which Nuxt
  # symlinks as dist/) instead of switching to the Netlify SSR preset.
  NITRO_PRESET = "static"

# SPA fallback for any client-only route.
[[redirects]]
  from = "/*"
  to = "/200.html"
  status = 200
